<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Ma Place</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="barre">
    <div class="marque">
      <span class="logo" aria-hidden="true">◧</span>
      <div>
        <h1>Ma Place</h1>
        <p class="sous-titre">Postes et salles de réunion · <span id="etage">3e étage</span></p>
      </div>
    </div>
    <div class="actions">
      <label class="qui">Qui suis-je ? <select id="qui"></select></label>
      <button id="btn-mes-reservations" class="bouton secondaire">Mes réservations</button>
      <button id="btn-salle-libre" class="bouton">Salle libre maintenant</button>
      <button id="btn-equipe" class="bouton secondaire">Mon équipe</button>
    </div>
    <div class="infos">
      <span id="horloge" class="pastille alerte" hidden></span>
      <span id="branche" class="pastille discrete" hidden></span>
    </div>
  </header>

  <nav id="jours" class="jours" aria-label="Choix du jour"></nav>

  <main class="contenu">
    <section class="carte carte-plan">
      <div id="plan" class="plan">Chargement du plan…</div>
      <div id="legende" class="legende"></div>
    </section>
    <aside class="colonne">
      <section id="panneau" class="carte panneau"></section>
      <section id="mes-reservations" class="carte" hidden></section>
    </aside>
  </main>

  <footer class="pied">Ma Place v0.4 · application interne · données fictives</footer>
  <script type="module" src="js/main.js"></script>
</body>
</html>
